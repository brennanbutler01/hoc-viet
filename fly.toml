app = "hoc-viet-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  LISTEN_ADDR = "0.0.0.0:8888"
  PUBLIC_DEMO = "true"
  VOCABULARY_FILE = "/tmp/hoc-viet-words.json"

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
